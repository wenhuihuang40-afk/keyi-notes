function askApiKey(opts){opts=opts||{};let isSet=!!opts.settings;return new Promise(resolve=>{let c=apiCfg();let legacy=(localStorage.getItem('yikeArkKey')||'');modal('<div class="card" style="max-width:560px;margin:0 auto"><h2 style="margin:0 0 8px">'+(isSet?'API 设置':'填写 API 信息')+'</h2><p class="hint">'+(isSet?'这里可以随时查看和修改你的 API 信息，保存后立即生效。':'')+'AI 转写音频与停顿分析通过你自己的 API 调用。任何兼容 OpenAI chat/completions 格式、且语音模型支持音频输入的服务均可使用。请到你的服务商控制台获取以下信息；所有内容只保存在你本机浏览器中，不会随文件分享给他人。</p><div class="field"><label>接口地址（Base URL，一般以 /v1 或 /api/v3 结尾）</label><input id="akBase" type="text" spellcheck="false" autocomplete="off" value="'+esc(c.base||'')+'" placeholder="例如：https://api.openai.com/v1 / https://api.siliconflow.cn/v1 等（以你的服务商文档为准）"></div><div class="field"><label>API Key</label><input id="akInput" type="text" spellcheck="false" autocomplete="off" value="'+esc(c.key||legacy||'')+'" placeholder="例如：KsXfYkHUO.FiGcV0HGkB0IBbSKD... 或 sk-xxxxxxxxxxxxxxxxxxxx"></div><div class="field"><label>文本模型（用于 AI 停顿分析）</label><input id="akText" type="text" spellcheck="false" autocomplete="off" value="'+esc(c.textModel||'')+'" placeholder="例如：gpt-4o-mini / deepseek-chat / qwen-plus 等（填你账号可用的文本模型）"></div><div class="field"><label>语音转写模型（用于音频转文字，需支持音频输入）</label><input id="akAsr" type="text" spellcheck="false" autocomplete="off" value="'+esc(c.asrModel||'')+'" placeholder="例如：gpt-4o-audio-preview / qwen-omni-turbo 等（填你账号支持音频输入的模型）"></div><p class="hint" style="margin:6px 0 0">'+(isSet?'修改后点“保存”即可生效，随时可以再次调整。':'填过一次后会自动记住，下次不再弹出；随时可修改更换服务商。')+'</p><div class="modal-actions"><button class="btn outline" id="akCancel">'+(isSet?'关闭':'取消')+'</button><button class="btn primary" id="akSave">'+(isSet?'保存':'保存并继续')+'</button></div></div>');let done=v=>{closeModal();resolve(v)};$('#akCancel').onclick=()=>done('');$('#akSave').onclick=()=>{let base=($('#akBase').value||'').trim().replace(/\/+$/,'');let key=($('#akInput').value||'').trim();let tm=($('#akText').value||'').trim();let am=($('#akAsr').value||'').tri async function postJSON(url,body,key){let headers={'Content-Type':'application/json'};if(key)headers['Authorization']='Bearer '+key;let res=await fetch(url,{method:'POST',headers,body:JSON.stringify(body)});let t=await res.text();let d;try{d=JSON.parse(t)}catch(e){throw new Error('返回内容异常：'+t.slice(0,100))}if(!res.ok)throw new Error((d&&d.error&&d.error.message)||('HTTP '+res.status));return d}
async function arkTranscribe(b64,fmt){let base=apiBase();if(!base)throw new Error('请先填写 API 信息（接口地址）');let model=apiCfg().asrModel;if(!model)throw new Error('请先填写 API 信息（语音转写模型）');let r=await postJSON(base+'/chat/completions',{model:model,messages:[{role:'user',content:[{type:'input_audio',input_audio:{data:b64,format:fmt}},{type:'text',text:'请逐字转写这段音频的完整内容（中文或英文），保留标点，只输出转写文本，不要任何解释、标题或前后缀。'}]}]},arkKey());let t=(r&&r.choices&&r.choices[0]&&r.choices[0].message&&r.choices[0].message.content)||'';if(!t||!t.trim())throw new Error('语音模型没有返回文本');return{text:t.trim(),segments:[],duration:0}}
async function chatText(prompt,model,maxTokens){let base=apiBase();if(!base)throw new Error('请先填写 API 信息（接口地址）');let body={model:model,max_tokens:maxTokens,messages:[{role:'user',content:prompt}]};if(/volces\.com/i.test(base))body.thinking={type:'disabled'};let d;try{d=await postJSON(base+'/chat/completions',body,arkKey())}catch(e){if(/thinking/i.test(e.message||'')){delete body.thinking;d=await postJSON(base+'/chat/completions',body,arkKey())}else throw e}let ch=(d&&d.choices&&d.choices[0]&&d.choices[0].message&&d.choices[0].message.content)||'';return typeof ch==='string'?ch:''}
function updateReviewTimes(){if(state.view!=='review')return;let a=$('#srcTime'),b=$('#itpTime');if(a)a.textContent=fmt(audioEl.currentTime)+' / '+fmt(audioEl.duration||0);if(b)b.textContent=fmt(interpEl.currentTime)+' / '+fmt(interpEl.duration||0)}
function canonChar(c){const m={'，':',','、':',','。':'.','！':'!','？':'?','：':':','；':';','“':'"','”':'"','‘':"'",'’':"'",'（':'(','）':')','《':'"','》':'"'};return m[c]!==undefined?m[c]:c.toLowerCase()}
function buildNorm(t){let n='',map=[];for(let i=0;i<t.length;i++){let c=t[i];if(/\s/.test(c))continue;n+=canonChar(c);map.push(i)}return{n:n,map:map}}
function findRange(norm,text,from){let nt='';for(let c of text){if(/\s/.test(c))continue;nt+=canonChar(c)}if(!nt)return null;let idx=norm.n.indexOf(nt,from);if(idx<0)return null;return[norm.map[idx],norm.map[idx+nt.length-1]+1]}
function parseJsonArray(text){let si=text.indexOf('[');if(si<0)return null;let ei=text.lastIndexOf(']');let seg=ei>si?text.slice(si,ei+1):text.slice(si);try{let a=JSON.parse(seg);if(Array.isArray(a))return a}catch(e){}
let objs=seg.match(/\{[^{}]*\}/g)||[];let arr=[];for(let o of objs){try{arr.push(JSON.parse(o))}catch(e){try{arr.push(JSON.parse(o.replace(/,(\s*[}\]])/g,'$1')))}catch(e2){}}}return arr.length?arr:null}
function aiHTML(s,a){if(!a?.transcript)return`<p class="hint">还没有原文。点击下方按钮可自动转写这段音频（结果会保存，下次选择直接显示）。若自动转写不可用，也可以到“笔记重构”里手动粘贴原文，停顿分析同样可用。</p><button class="btn primary wide" id="aiTranscribeBtn">AI 转写音频原文</button>`;let pauses=(s?.aiPauses||[]).slice().sort((x,y)=>x.start-y.start);if(!pauses.length)return`<p class="hint">点击右上角按钮，AI 将根据笔记笔画的时间戳找出书写停顿（≥ 阈值的间隔），并高亮停顿时对应的原文内容。</p><div class="ai-transcript">${esc(a.transcript)}</div>`;let norm=buildNorm(a.transcript),ranges=[],from=0,matched=0;for(let p of pauses){let r=findRange(norm,p.text,from);if(!r&&from>0)r=findRange(norm,p.text,0);if(!r&&Array.isArray(a._asrSegments)&&a._asrSegments.length){let segs=a._asrSegments.filter(g=>g.text&&g.start<p.end&&g.end>p.start),rs=[],pos=from;for(let g of segs){let rr=findRange(norm,g.text.trim(),pos);if(!rr)rr=findRange(norm,g.text.trim(),0);if(rr){rs.push(rr);pos=rr[1]}}if(rs.length)r=[rs[0][0],rs[rs.length-1][1]]}if(r){ranges.push({s:r[0],e:r[1],p:p});matched++;from=r[1]}}ranges.sort((x,y)=>x.s-y.s);let html='',last=0;for(let r of ranges){if(r.s<last)continue;html+=esc(a.transcript.slice(last,r.s))+`<mark class="pause-hl" data-start="${r.p.start}" data-end="${r.p.end}" title="书写停顿 ${fmt(r.p.start)} – ${fmt(r.p.end)}，点击回听原音">${esc(a.transcript.slice(r.s,r.e))}</mark>`;last=r.e}html+=esc(a.transcript.slice(last));return`<p class="hint ai-pauselist">检测到 ${pauses.length} 处停顿（${pauses.map(p=>fmt(p.start)+'–'+fmt(p.end)).join('、')}），已高亮 ${matched} 处对应原文${matched<pauses.length?'，其余停顿未能定位到原文':''} · 点击黄色高亮可回听对应原音片段</p><div class="ai-transcript">${html}</div>`}
async function analyzePauses(){let s=currentSession(),a=currentAudio();if(!s||!a)return;if(!(apiCfg().base&&arkKey()&&apiCfg().textModel)){let k=await askApiKey();if(!k)return}if(!a.transcript||!a.transcript.trim()){toast('这段音频还没有原文，请先在“笔记重构”里点“AI 转写音频原文”，或手动粘贴原文',true);return}let th=+($('#aiThreshold')?.value||state.aiThreshold||2);let strokes=(s.strokes||[]).filter(x=>x.t0!=null&&x.t0>=0).sort((x,y)=>x.t0-y.t0);if(strokes.length<2){toast('本次练习没有带时间戳的笔记笔画，无法分析',true);return}let pauses=[];for(let i=1;i<strokes.length;i++){let gap=strokes[i].t0-strokes[i-1].t1;if(gap>=th)pauses.push({start:Math.max(0,strokes[i-1].t1),end:strokes[i].t0})}if(!pauses.length){toast(`本次练习未检测到 ${th} 秒以上的书写停顿`);return}if(Array.isArray(a._asrSegments)&&a._asrSegments.length){let items=pauses.map(p=>{let segs=a._asrSegments.filter(g=>g.text&&g.start<p.end&&g.end>p.start);return{start:p.start,end:p.end,text:segs.map(g=>g.text).join('')}});s.aiPauses=items;await save();renderReview();toast(`分析完成：按转写时间戳定位了 ${items.filter(x=>x.text).length}/${items.length} 处停顿对应的原文（黄色高亮）`);return}let btn=$('#aiAnalyze');if(btn){btn.disabled=true;btn.textContent='AI 分析中…'}let prompt='你是同声传译训练教练。下面是一段口译练习的原文全文，以及学习者记笔记时的书写停顿时间段（秒，相对原音播放时间）。停顿通常说明学习者听到对应内容时在犹豫、思考或跟不上。请判断每个停顿时间段对应的原文内容。\n只返回一个 JSON 数组，不要输出任何其他文字或代码块标记，格式：[{"start":数字秒,"end":数字秒,"text":"与此停顿对应的原文连续片段"}]。注意：text 必须直接从原文复制、逐字一致（包括标点），不要改写；数组按 start 升序；输出尽量简短。\n原文全文：\n"""\n'+a.transcript+'\n"""\n停顿时间段（秒）：'+JSON.stringify(pauses.map(p=>({start:+p.start.toFixed(1),end:+p.end.toFixed(1)})));let text;try{text=await chatText(prompt,apiCfg().textModel,4096)}catch(e){if(isAuthErr(e)){clearKeyAndAsk('API Key 无效或已过期，请重新填写后再分析');if(btn){btn.disabled=false;btn.textContent='分析笔记流畅性'}return}toast('AI 请求失败：'+e.message,true);if(btn){btn.disabled=false;btn.textContent='分析笔记流畅性'}return}let arr=text?parseJsonArray(text):null;if(!Array.isArray(arr)){toast('AI 返回格式无法解析：'+(text||'(空)').slice(0,80),true);if(btn){btn.disabled=false;btn.textContent='分析笔记流畅性'}return}let items=arr.filter(x=>x&&isFinite(+x.start)&&isFinite(+x.end)&&x.text&&+x.end>+x.start).map(x=>({start:+x.start,end:+x.end,text:String(x.text)})).sort((x,y)=>x.start-y.start);if(!items.length){toast('AI 未返回有效的停顿判定',true);if(btn){btn.disabled=false;btn.textContent='分析笔记流畅性'}return}s.aiPauses=items;await save();renderReview();toast(`AI 分析完成：判定 ${items.length} 处停顿，对应原文已在下方黄色高亮`)}
function blobToB64(blob){return new Promise((res,rej)=>{let r=new FileReader();r.onload=()=>res(r.result.split(',')[1]);r.onerror=()=>rej(r.error);r.readAsDataURL(blob)})}
function audioExt(blob,a){let m=(a?.name||'').match(/\.([a-zA-Z0-9]{1,6})$/);if(m)return m[1].toLowerCase();let t=(blob?.type||'').match(/(mp3|wav|m4a|webm|ogg|flac|aac|opus)/);return t?t[1]:'mp3'}
async function transcribeOriginal(a){if(!a)return;if(a._transcribing)return;if(!(apiCfg().base&&arkKey()&&apiCfg().asrModel)){let k=await askApiKey();if(!k)return}let blob=await get('blobs','original:'+a.id);if(!blob){toast('找不到这段音频的文件，无法转写',true);return}if(a.transcript&&!confirm('该音频已有原文，重新转写将覆盖现有内容，继续吗？'))return;a._transcribing=true;let btn=$('#aiTranscribe')||$('#aiTranscribeBtn');if(btn){btn.disabled=true;btn.textContent='转写中…（长音频可能需要几分钟）'}toast('正在转写音频，长音频可能需要几分钟，请稍候…');try{let b64=await blobToB64(blob);let fmt=audioExt(blob,a);if(b64.length>7*1024*1024)throw new Error('音频过大（超过约 5MB），请先压缩音频后重试');let d=await arkTranscribe(b64,fmt);a.transcript=d.text;a._asrSegments=d.segments||[];await save();toast(`转写完成并已保存（音频 ${Math.round(d.duration||0)} 秒），下次选择会自动显示`);if(state.view==='rebuild')renderRebuild();else if(state.view==='review')renderReview()}catch(e){if(isAuthErr(e)){clearKeyAndAsk('API Key 无效或已过期，请重新填写后再转写');return}toast('转写失败：'+e.message,true)}finally{a._transcribing=false;if(btn&&document.getElementById(btn.id)){btn.disabled=false;btn.textContent='AI 转写音频原文'}}}
function stopPlayback(){audioEl.pause();interpEl.pause();audioEl._reviewKey=null;interpEl._reviewKey=null}
init().catch(e=>{console.error(e);toast('无法初始化本地数据库，请检查浏览器隐私设置',true)});
})();
